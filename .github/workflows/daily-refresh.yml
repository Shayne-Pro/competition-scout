name: Daily refresh

# 每日由 GitHub 服务器自动执行：AI 核验/发现 → 状态翻转 → 重建页面 → 推回 main。
# Pages 检测到 main 有新提交即自动重新部署，无需人工干预、不依赖本地 Mac。
# LLM 走 GitHub Models 免费层（公开仓库），模型在 ai_update.py 的 GH_MODEL 里配置。
on:
  schedule:
    - cron: "20 0 * * *"   # UTC 00:20 = 北京时间 08:20（避开整点高峰）
  workflow_dispatch: {}     # 手动触发（调试用）

permissions:
  contents: write           # 允许把构建产物推回仓库
  models: read              # GitHub Models 免费推理（公开仓库免费额度）

concurrency:
  group: daily-refresh
  cancel-in-progress: false # 与本地任务推送撞车时排队而非互相取消

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Date flip and reminders
        run: python3 daily_refresh.py

      - name: Scrape SPA sources (Playwright)
        run: |
          pip install playwright -q
          python3 -m playwright install --with-deps chromium
          python3 scrape_spa.py
        continue-on-error: true   # 单源失败/Cloudflare 拦截不阻断；状态记入 spa_snapshot.json

      - name: AI verify and discover (Zhipu glm-5.3-flash)
        run: python3 ai_update.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          GH_MODEL: ${{ secrets.LLM_MODEL }}
        continue-on-error: true   # LLM 失败不阻断发布链路；状态记录在 runs-log

      - name: Rebuild page
        run: python3 build_page.py

      - name: Self check
        run: python3 ci_check.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "每日刷新 $(date +%F)：AI 核验/发现 + 状态翻转 + 页面重建（GitHub Actions）"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
