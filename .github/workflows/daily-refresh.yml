name: Daily refresh

on:
  schedule:
    - cron: '20 0 * * *' # 北京时间 08:20；GitHub 可能延迟调度。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只验证并上传产物，不写 main 或部署页面'
        type: boolean
        default: true
      max_steps:
        description: '本次 Agent 最大模型轮数（1–100）'
        type: number
        default: 100
      target_limit:
        description: '本次最多复核条目数（1–20）'
        type: number
        default: 20

permissions:
  contents: read

concurrency:
  group: daily-refresh
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: '1'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.package.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install browser fallback
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Check deterministic code
        run: python3 -m unittest discover -s tests -v
      - name: Prepare source and verification queues
        env:
          TARGET_LIMIT: ${{ inputs.target_limit || 20 }}
        run: python3 scout.py prepare --limit "$TARGET_LIMIT"
      - name: Run competition-scout Skill with GLM
        id: agent
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          AGENT_MAX_STEPS: ${{ inputs.max_steps || 100 }}
          AGENT_MAX_SECONDS: '1200'
        run: python3 agent_refresh.py
      - name: Apply validated proposal or retain previous data
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          if [ "$AGENT_OUTCOME" = success ]; then
            python3 scout.py apply
          else
            python3 scout.py failed
          fi
          python3 daily_refresh.py
          python3 build_page.py
          python3 ci_check.py
      - name: Package publication files
        id: package
        run: |
          python3 scripts/package_run.py
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-${{ github.run_id }}
          path: .scout/catalogue/
          include-hidden-files: true
          retention-days: 14
      - name: Preserve proposal and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-evidence-${{ github.run_id }}
          path: |
            .scout/task.json
            .scout/proposal.json
            .scout/evidence.json
            .scout/agent.jsonl
          include-hidden-files: true
          retention-days: 7
      - name: Fail visibly when the Agent did not run successfully
        if: steps.agent.outcome != 'success'
        run: exit 1

  publish:
    needs: refresh
    if: >-
      always() && needs.refresh.outputs.ready == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: catalogue-${{ github.run_id }}
          path: .scout/publish/
      - name: Commit the validated catalogue and request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py .scout/publish
