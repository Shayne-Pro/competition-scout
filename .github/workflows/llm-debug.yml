name: LLM debug (manual only)

on:
  workflow_dispatch: {}

permissions:
  models: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe inline
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, os
          tok = os.environ.get("GITHUB_TOKEN", "")
          print("token len:", len(tok))
          for name, payload in [
              ("plain", {"model":"openai/gpt-4.1","messages":[{"role":"user","content":"reply BANANA"}],"max_tokens":10}),
              ("json_mode", {"model":"openai/gpt-4.1","messages":[{"role":"user","content":"reply BANANA"}],"max_tokens":10,"response_format":{"type":"json_object"}}),
          ]:
              for url in ["https://models.github.ai/inference/chat/completions",
                          "https://models.inference.ai.azure.com/chat/completions",
                          "https://api.githubcopilot.com/chat/completions"]:
                  try:
                      req = urllib.request.Request(url, data=json.dumps(payload).encode(),
                          headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
                      r = urllib.request.urlopen(req, timeout=60)
                      b = r.read()
                      print(name, url, "->", r.status, r.headers.get("Content-Type"), len(b), b[:120])
                  except urllib.error.HTTPError as e:
                      print(name, url, "-> HTTP", e.code, e.read()[:150])
                  except Exception as e:
                      print(name, url, "-> ERR", repr(e)[:100])
          PY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
